name: pages
on:
  push:
    branches: [main]      # the site follows main
    paths: ["site/**", ".github/workflows/pages.yml"]
    tags: ["v*"]          # published schemas change only with a release (section 7.4)
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: main
          fetch-depth: 0  # the release tags
      - name: Assemble the site from main and the schemas from release tags (at their $id paths)
        run: |
          set -eu
          mkdir -p _site/schema
          cp -r site/. _site/
          tags=$(git tag -l 'v*' --sort=v:refname)
          if [ -z "$tags" ]; then
            echo "no release tag: refusing to publish without schemas"
            exit 1
          fi
          for t in $tags; do  # a later release may add files, never change a published one (section 7.4)
            rm -rf "$RUNNER_TEMP/rel" && mkdir "$RUNNER_TEMP/rel"
            git archive "$t" schemas | tar -x -C "$RUNNER_TEMP/rel"
            changed=0
            for f in $(cd "$RUNNER_TEMP/rel/schemas" && find . -type f); do
              if [ -e "_site/schema/$f" ] && ! cmp -s "$RUNNER_TEMP/rel/schemas/$f" "_site/schema/$f"; then
                echo "::error::$t changes schema/${f#./}, which an earlier release published (section 7.4)"
                changed=1
              fi
            done
            [ "$changed" = 0 ] || exit 1
            cp -r "$RUNNER_TEMP/rel/schemas/." _site/schema/
            echo "schemas from $t:" $(ls "$RUNNER_TEMP/rel/schemas")
          done
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
