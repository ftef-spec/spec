name: fuzz
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * 0"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evaluator:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install pinned tools
        run: python -m pip install --require-hashes -r tools/fuzz-requirements.txt
      - name: Fuzz the evaluator with valid records (60 s per change, 20 min weekly)
        env:
          SECONDS_TO_RUN: ${{ github.event_name == 'schedule' && '1200' || '60' }}
        run: |
          mkdir -p corpus artifacts
          python tools/fuzz_evaluate.py -max_total_time="$SECONDS_TO_RUN" -artifact_prefix=artifacts/ corpus
      - name: Keep the failing input
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts
          path: artifacts/
