name: check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install pinned tools
        run: python -m pip install --require-hashes -r tools/requirements.txt
      - name: Schemas, examples and invariants
        run: python tools/check.py
      - name: Brand files match their master
        run: python brand/build.py --check
      - name: REUSE licensing
        run: reuse lint
      - name: DCO sign-off by the author on every commit of the pull request
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for c in $(git rev-list "$BASE..$HEAD"); do
            author=$(git log -1 --format='%an <%ae>' "$c")
            signoff="Signed-off-by: $author"
            # Dependabot signs off with a different address than the one it commits with
            if [ "$author" = "dependabot[bot] <49699333+dependabot[bot]@users.noreply.github.com>" ]; then
              signoff="Signed-off-by: dependabot[bot] <support@github.com>"
            fi
            if ! git log -1 --format=%B "$c" | grep -qxF "$signoff"; then
              echo "::error::commit $c has no DCO sign-off by its author ($author); use git commit -s"; missing=1
            fi
          done
          exit $missing
